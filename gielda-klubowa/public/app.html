<!doctype html>
<html lang="pl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Giełda Klubowa</title>
<link rel="stylesheet" href="css/app.css">
</head>
<body>

<header class="top">
  <div class="brand">
    <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M7 3v4M7 16v5M17 5v4M17 15v4" /><rect x="4.5" y="7" width="5" height="9" rx="1" /><rect x="14.5" y="9" width="5" height="6" rx="1" class="f" /></svg>
    <span>Giełda Klubowa</span>
  </div>

  <label class="sym" title="Wpisz parę z Binance i Enter">
    <input id="symbol" list="symbols" spellcheck="false" autocomplete="off" value="BTCUSDT">
    <datalist id="symbols"></datalist>
  </label>

  <nav class="tfs" id="tfs" aria-label="Interwał"></nav>

  <div class="sp"></div>
  <div class="live" id="live"><i></i><span>Łączę…</span></div>
  <div class="src">Binance</div>
</header>

<main class="wrap" id="wrap">
  <canvas id="gl"></canvas>
  <div id="chart"></div>
  <div class="legend" id="legend"></div>
  <button class="to-now" id="toNow" title="Wróć do najnowszych świec">»</button>
  <div class="loading" id="loading">Ładuję świece…</div>
  <div class="toast" id="toast"></div>
</main>

<footer class="status">
  <span id="stFile">—</span>
  <span id="stHist"></span>
  <span class="sp"></span>
  <span id="stGl" class="num"></span>
  <a id="stLib" href="https://www.tradingview.com/" target="_blank" rel="noopener" title="Biblioteka wykresu: TradingView Lightweight Charts™ (Apache 2.0)">Lightweight Charts™ · TradingView</a>
  <button id="auto" title="Automatyczna skala ceny (podwójny klik na skali też ją przywraca)">Auto</button>
</footer>

<script src="vendor/lightweight-charts.js"></script>
<script type="module" src="js/app.js"></script>
</body>
</html>
